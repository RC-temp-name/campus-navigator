[project]
name = "campus-navigator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.2",
    "gunicorn>=25.3.0",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]  # makes `app` importable from tests/

