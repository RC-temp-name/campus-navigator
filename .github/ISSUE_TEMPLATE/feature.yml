name: Feature request
description: Propose a new feature or enhancement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: What problem does this solve, and for who? Describe the need, not the solution.
      placeholder: "e.g. Users on the ground floor have no quick way to find the nearest accessible restroom."
    validations:
      required: true
  - type: textarea
    id: proposed-behavior
    attributes:
      label: Proposed behavior
      description: How should the feature behave? What does the user see and do?
      placeholder: "e.g. Add a 'Nearest restroom' button that highlights the closest restroom and shows a route to it."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why you didn't choose them.
      placeholder: "e.g. Filtering the room list by 'restroom' instead of a dedicated button — less discoverable."
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope for this issue, and explicitly what is out of scope.
      placeholder: |
        In scope: the button and a route to the nearest restroom.
        Out of scope: multi-building support, a native mobile app.
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: What outcome, when tested, shows this feature is complete?
      placeholder: |
        - Given a user on the ground floor, when they tap "Nearest restroom", a route to the nearest restroom is shown.
        - The route reuses the existing pathfinding and directions.
      render: markdown
    validations:
      required: false
  - type: textarea
    id: mockups
    attributes:
      label: Mockups or references
      description: Links to mockups, sketches, or similar features elsewhere. Drag and drop images here.
    validations:
      required: false
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and discussions and this hasn't already been proposed.
          required: true
